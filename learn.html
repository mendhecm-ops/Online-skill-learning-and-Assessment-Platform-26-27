{% extends "base.html" %}

{% block content %}
<h2>{{ course.title }}</h2>
<div style="margin: 1.5rem 0; line-height: 1.6; background: #f9f9f9; padding: 1.5rem; border-left: 4px solid #3498db;">
    <h3>Course Material</h3>
    <p>{{ course.content }}</p>
</div>
<a href="{{ url_for('quiz', course_id=course.id) }}" class="btn btn-success">Take Assessment Quiz</a>
<a href="{{ url_for('courses') }}" class="btn" style="background: #7f8c8d;">Back to Courses</a>
{% endblock %}
