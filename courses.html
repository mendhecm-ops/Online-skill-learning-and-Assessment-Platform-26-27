{% extends "base.html" %}

{% block content %}
<h2>Available Courses</h2>
<div style="margin-top: 1.5rem;">
    {% for course in courses %}
        <div class="course-card">
            <h3>{{ course.title }}</h3>
            <p>{{ course.description }}</p>
            <a href="{{ url_for('learn', course_id=course.id) }}" class="btn">Start Learning</a>
        </div>
    {% endfor %}
</div>
{% endblock %}
